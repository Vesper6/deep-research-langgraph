<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepResearch</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #656d76; --line: #d0d7de; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8d96a0; --line: #30363d; --accent: #4c8dff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.7 system-ui, "Microsoft YaHei", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input { flex: 1; min-width: 200px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 15px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  ol { margin: 0 0 14px; padding-left: 22px; }
  #log { color: var(--muted); font-size: 14px; white-space: pre-line; }
  #report { overflow-wrap: anywhere; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>DeepResearch</h1>
  <p class="sub">规划 → 人工审核 → 并行检索（联网 + 知识库）→ 反思补搜 → 带引用的报告</p>

  <div class="card">
    <div class="row">
      <input id="topic" placeholder="输入研究主题，例如：网易有哪些业务">
      <button id="startBtn">开始研究</button>
    </div>
  </div>

  <div class="card hidden" id="reviewCard">
    <h2>⏸ 请审核子问题</h2>
    <ol id="questions"></ol>
    <div class="row">
      <button id="agreeBtn">同意</button>
      <input id="feedback" placeholder="或者输入修改意见">
      <button class="ghost" id="reviseBtn">提交修改意见</button>
    </div>
  </div>

  <div class="card hidden" id="logCard"><h2>进度</h2><div id="log"></div></div>
  <div class="card hidden" id="reportCard"><div id="report"></div></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let threadId = null;

function show(id) { $(id).classList.remove("hidden"); }
function hide(id) { $(id).classList.add("hidden"); }
function log(text) { show("logCard"); $("log").textContent += text + "\n"; }
function render(md) { $("report").innerHTML = DOMPurify.sanitize(marked.parse(md)); }

function showQuestions(questions) {
  $("questions").innerHTML = "";
  for (const q of questions) {
    const li = document.createElement("li");
    li.textContent = q;
    $("questions").appendChild(li);
  }
  show("reviewCard");
}

// 第 1 步：POST /start，拿到子问题
$("startBtn").onclick = async () => {
  const topic = $("topic").value.trim();
  if (!topic) return;
  $("startBtn").disabled = true;
  $("log").textContent = ""; hide("reportCard"); hide("reviewCard");
  log("📝 正在拆解子问题……");
  const res = await fetch("/start", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ topic }),
  });
  const data = await res.json();
  threadId = data.thread_id;
  showQuestions(data.questions);
  $("startBtn").disabled = false;
};

// 第 2 步：POST /resume，一边读一边显示（SSE）
async function resume(decision) {
  hide("reviewCard");
  log(decision === "同意" ? "✅ 你同意了，开始检索" : "✏️ 修改意见：" + decision);
  let report = "";
  const res = await fetch("/resume", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ thread_id: threadId, decision }),
  });
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const parts = buf.split("\n\n");   // SSE 每条消息以空行结尾
    buf = parts.pop();                 // 最后一段可能还没收完，留到下次
    for (const p of parts) {
      if (!p.startsWith("data: ")) continue;
      const ev = JSON.parse(p.slice(6));
      if (ev.type === "step") log(ev.text);
      if (ev.type === "token") { report += ev.text; show("reportCard"); render(report); }
      if (ev.type === "review") showQuestions(ev.questions);
      if (ev.type === "done") { show("reportCard"); render(ev.report); log("🎉 完成"); }
    }
  }
}

$("agreeBtn").onclick = () => resume("同意");
$("reviseBtn").onclick = () => {
  const text = $("feedback").value.trim();
  if (!text) return;
  $("feedback").value = "";
  resume(text);
};
$("topic").addEventListener("keydown", (e) => { if (e.key === "Enter") $("startBtn").click(); });
</script>
</body>
</html>
